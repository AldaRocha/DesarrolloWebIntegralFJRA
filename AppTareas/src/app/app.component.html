<div class="card">
  <h1>
    Aplicaci&oacute;n Tareas Angular
  </h1>
  <div class="container mt-4">
    <h1>
      Lista Tareas
    </h1>
    <table class="table">
      <thead>
        <h2 *ngIf="!isResultLoaded">
          Cargando Datos...
        </h2>
        <tr>
          <th scope="col">
            ID
          </th>
          <th scope="col">
            Tarea
          </th>
          <th scope="col">
            &nbsp;
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tarea of listaTareas">
          <td>
            {{ tarea.tareaId }}
          </td>
          <td>
            {{ tarea.nombre }}
          </td>
          <td>

          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="container mt-4">
    <h1>
      Aplicaci&oacute;n Angular Empleados
    </h1>
    <a routerLink="/empleados" class="btn btn-primary">
      Ir a Empleados
    </a>
    <router-outlet></router-outlet>
  </div>
</div>
